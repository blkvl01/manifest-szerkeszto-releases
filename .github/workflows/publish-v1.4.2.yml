name: Publish Manifest Szerkeszto v1.4.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and upload EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="6fe9f33e61e77ae8fa9c7a1fef365c501852b6adf665f56a7a5e73b0f2525b48"
          actual="$(sha256sum release-assets/ManifestSzerkeszto.exe | awk '{print $1}')"
          test "$actual" = "$expected"
          gh release upload v1.4.2 release-assets/ManifestSzerkeszto.exe --repo "$GITHUB_REPOSITORY"
