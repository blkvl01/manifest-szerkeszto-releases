name: Publish Manifest Szerkeszto v1.4.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and upload EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="2fa66778f018cc2e5e4ebaac17b8fc7380243390c58755c660a66d360e42f549"
          actual="$(sha256sum release-assets/ManifestSzerkeszto.exe | awk '{print $1}')"
          test "$actual" = "$expected"
          gh release upload v1.4.0 release-assets/ManifestSzerkeszto.exe --repo "$GITHUB_REPOSITORY"
